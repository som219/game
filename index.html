<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>남극 공룡 탈출</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1630; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; image-rendering: auto; }
  @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 440, PX = 380;

// ---------- 사운드 ----------
let actx = null;
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(520, 0.12, 'square', 0.06, 300),
  slide: () => beep(200, 0.15, 'triangle', 0.08, -100),
  fish: () => { beep(880, 0.08, 'square', 0.05); setTimeout(() => beep(1320, 0.1, 'square', 0.05), 70); },
  cocoa: () => { beep(600, 0.1, 'sine', 0.1); setTimeout(() => beep(900, 0.15, 'sine', 0.1), 90); },
  hit: () => beep(140, 0.3, 'sawtooth', 0.12, -80),
  roar: () => { beep(90, 0.6, 'sawtooth', 0.15, -40); beep(130, 0.5, 'square', 0.06, -60); },
  stomp: () => beep(60, 0.12, 'triangle', 0.12, -20),
};

// ---------- 최고 기록 ----------
let best = 0;
try { best = +localStorage.getItem('dino-antarctica-best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('dino-antarctica-best', best); } catch (e) {} }

// ---------- 상태 ----------
let state = 'title'; // title | play | over
let t = 0, dist = 0, speed, score, gap, obstacles, items, particles, snow, player, spawnIn, itemIn, shake, invuln, roarCd, overReason, penguins, stompT;

function reset() {
  t = 0; dist = 0; speed = 360; score = 0; gap = 240;
  obstacles = []; items = []; particles = []; penguins = [];
  spawnIn = 500; itemIn = 300; shake = 0; invuln = 0; roarCd = 2; stompT = 0;
  player = { y: GROUND, vy: 0, onGround: true, jumps: 0, sliding: 0, falling: false, anim: 0 };
}
reset();
snow = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.6, s: Math.random() * 40 + 30 }));

// ---------- 입력 ----------
const keys = {};
function jump() {
  if (state !== 'play') { start(); return; }
  if (player.falling) return;
  if (player.onGround || player.jumps < 2) {
    player.vy = player.jumps === 0 ? -820 : -700;
    player.onGround = false; player.jumps++; player.sliding = 0;
    sfx.jump();
  }
}
function slide(on) {
  if (state !== 'play' || player.falling) return;
  if (on) {
    if (!player.onGround) player.vy = Math.max(player.vy, 900); // 공중에서 빠르게 낙하
    if (!player.sliding) sfx.slide();
    player.sliding = 1;
  } else player.sliding = 0;
}
function start() {
  if (state === 'over' && t < 0.8) return;
  reset(); state = 'play'; sfx.roar(); shake = 0.5;
}
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!keys[e.code]) jump(); }
  if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); slide(true); }
  if (e.code === 'Enter' && state !== 'play') start();
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (['ArrowDown', 'KeyS'].includes(e.code)) slide(false);
});
let touchStartY = null, touchSlide = false;
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const y = (e.clientY - r.top) / r.height;
  touchStartY = e.clientY;
  if (state === 'play' && y > 0.6) { touchSlide = true; slide(true); }
  else jump();
});
cv.addEventListener('pointermove', e => {
  if (touchStartY !== null && !touchSlide && e.clientY - touchStartY > 40) { touchSlide = true; slide(true); }
});
addEventListener('pointerup', () => { touchStartY = null; if (touchSlide) { touchSlide = false; slide(false); } });

// ---------- 스폰 ----------
const rnd = (a, b) => a + Math.random() * (b - a);
function spawnObstacle() {
  const lvl = Math.min(1, dist / 12000);
  const roll = Math.random();
  let o;
  if (roll < 0.32) o = { type: 'ice', w: rnd(44, 60), h: rnd(48, 70) };
  else if (roll < 0.52) o = { type: 'pile', w: rnd(70, 110), h: rnd(26, 36) };
  else if (roll < 0.72 + lvl * 0.05) o = { type: 'arch', w: 70, h: 0 };
  else o = { type: 'gap', w: rnd(90, 130 + lvl * 50), h: 0 };
  o.x = W + 40;
  obstacles.push(o);
  // 후반엔 가끔 연속 장애물
  if (lvl > 0.4 && Math.random() < lvl * 0.35 && o.type !== 'gap') {
    obstacles.push({ type: 'pile', w: 60, h: 28, x: W + 40 + o.w + rnd(170, 230) });
  }
}
function spawnItem() {
  const cocoa = Math.random() < 0.18;
  const high = Math.random() < 0.5;
  const n = cocoa ? 1 : Math.floor(rnd(3, 6));
  for (let i = 0; i < n; i++) {
    items.push({ type: cocoa ? 'cocoa' : 'fish', x: W + 40 + i * 44, y: high ? GROUND - rnd(120, 150) : GROUND - 40, bob: Math.random() * 6 });
  }
}

// ---------- 업데이트 ----------
function hurt(amount, reason) {
  if (invuln > 0) return;
  gap -= amount; invuln = 1.2; shake = 0.35; sfx.hit();
  for (let i = 0; i < 14; i++) particles.push({ x: PX, y: player.y - 30, vx: rnd(-200, 200), vy: rnd(-300, -50), life: 0.7, c: '#e8f6ff', r: rnd(2, 5) });
  if (gap <= 40) gameOver(reason);
}
function gameOver(reason) {
  if (state !== 'play') return;
  state = 'over'; t = 0; overReason = reason; shake = 0.6; sfx.roar();
  score = Math.floor(score);
  if (score > best) { best = score; saveBest(); }
}

function update(dt) {
  t += dt;
  for (const s of snow) {
    s.y += s.s * dt; s.x -= (state === 'play' ? speed * 0.15 : 20) * dt * s.r;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    if (s.x < -5) s.x = W + 5;
  }
  shake = Math.max(0, shake - dt);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  if (state === 'over') {
    // 공룡이 플레이어를 덮침
    gap = Math.max(-60, gap - 400 * dt);
    return;
  }
  if (state !== 'play') { dist += 120 * dt; return; }

  speed = Math.min(820, 360 + dist / 40);
  const dx = speed * dt;
  dist += dx;
  score += dx / 10;
  invuln = Math.max(0, invuln - dt);

  // 간격 회복 (최대 260)
  if (gap < 260) gap = Math.min(260, gap + 10 * dt);
  roarCd -= dt;
  if (gap < 130 && roarCd < 0) { sfx.roar(); shake = 0.4; roarCd = 3.5; }
  stompT += dt * speed / 140;
  if (stompT > 1) { stompT = 0; if (gap < 180) { sfx.stomp(); shake = Math.max(shake, 0.08); } }

  // 플레이어 물리
  const p = player;
  p.anim += dt * speed / 40;
  if (!p.onGround || p.falling) {
    p.vy += (p.falling ? 1800 : 2300) * dt;
    p.y += p.vy * dt;
  }
  // 크레바스 체크
  const overGap = obstacles.some(o => o.type === 'gap' && PX - 10 > o.x && PX + 10 < o.x + o.w);
  if (!p.falling) {
    if (p.y >= GROUND) {
      if (overGap) { p.falling = true; p.onGround = false; }
      else { p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 0; }
    } else if (p.onGround && overGap) { p.falling = true; p.onGround = false; }
    else if (p.onGround) {}
  }
  if (p.onGround && overGap && !p.falling) { p.falling = true; p.onGround = false; }
  if (p.falling && p.y > H + 60) { gameOver('crevasse'); return; }

  // 장애물
  spawnIn -= dx;
  if (spawnIn <= 0) { spawnObstacle(); spawnIn = rnd(420, 720) * (0.8 + speed / 1600); }
  itemIn -= dx;
  if (itemIn <= 0) { spawnItem(); itemIn = rnd(500, 900); }
  if (Math.random() < dt * 0.15) penguins.push({ x: W + 20, y: GROUND - 95 - Math.random() * 10, f: Math.random() * 10 });

  const ph = p.sliding && p.onGround ? 30 : 62;
  const pb = { x: PX - 14, y: p.y - ph, w: 28, h: ph };
  for (const o of obstacles) {
    o.x -= dx;
    if (o.hit || o.type === 'gap') continue;
    let box;
    if (o.type === 'arch') box = { x: o.x + 10, y: 0, w: o.w - 20, h: GROUND - 46 };
    else box = { x: o.x + 4, y: GROUND - o.h + 4, w: o.w - 8, h: o.h };
    if (pb.x < box.x + box.w && pb.x + pb.w > box.x && pb.y < box.y + box.h && pb.y + pb.h > box.y) {
      o.hit = true;
      hurt(o.type === 'pile' ? 70 : 95, 'caught');
    }
  }
  obstacles = obstacles.filter(o => o.x + o.w > -60);

  for (const it of items) {
    it.x -= dx;
    const iy = it.y + Math.sin(t * 4 + it.bob) * 4;
    if (!it.got && Math.abs(it.x - PX) < 28 && Math.abs(iy - (p.y - ph / 2)) < ph / 2 + 16) {
      it.got = true;
      if (it.type === 'fish') { score += 25; sfx.fish(); }
      else { gap = Math.min(300, gap + 90); score += 100; sfx.cocoa(); invuln = Math.max(invuln, 0.5); }
      for (let i = 0; i < 8; i++) particles.push({ x: it.x, y: iy, vx: rnd(-120, 120), vy: rnd(-200, 0), life: 0.5, c: it.type === 'fish' ? '#ffd84a' : '#ff9a5a', r: 3 });
    }
  }
  items = items.filter(i => i.x > -40 && !i.got);
  for (const pg of penguins) { pg.x -= dx * 0.55; pg.f += dt * 8; }
  penguins = penguins.filter(pg => pg.x > -40);

  if (gap <= 40) gameOver('caught');
}

// ---------- 그리기 ----------
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#0b1630'); g.addColorStop(0.55, '#26406e'); g.addColorStop(1, '#8fb3d9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 오로라
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) {
      const y = 90 + k * 26 + Math.sin(x / 120 + t * 0.6 + k) * 22 + Math.sin(x / 47 + t * 0.9) * 8;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.lineTo(W, 0); ctx.lineTo(0, 0); ctx.closePath();
    const ag = ctx.createLinearGradient(0, 40, 0, 160);
    ag.addColorStop(0, 'rgba(0,0,0,0)'); ag.addColorStop(1, k === 1 ? 'rgba(160,90,255,0.18)' : 'rgba(60,255,170,0.16)');
    ctx.fillStyle = ag; ctx.fill();
  }
  ctx.restore();
  // 별
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = (i * 53) % 150; ctx.fillRect(x, y, 1.5, 1.5); }
}
function mountains(par, base, amp, col, seed) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);
  const off = (dist * par) % 400;
  for (let x = -off - 400; x <= W + 400; x += 100) {
    const i = Math.floor((x + dist * par) / 100);
    const h = amp * (0.5 + 0.5 * Math.abs(Math.sin(i * 12.9898 + seed)));
    ctx.lineTo(x, base - h); ctx.lineTo(x + 50, base - h * 0.6);
  }
  ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
}
function ground() {
  ctx.fillStyle = '#eaf4ff'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#c9def3'; ctx.fillRect(0, GROUND, W, 6);
  ctx.fillStyle = '#d6e7f8';
  const off = dist % 80;
  for (let x = -off; x < W; x += 80) { ctx.fillRect(x, GROUND + 26, 36, 3); ctx.fillRect(x + 40, GROUND + 58, 22, 3); }
}
function drawObstacle(o) {
  if (o.type === 'gap') {
    ctx.fillStyle = '#0d2340'; ctx.fillRect(o.x, GROUND, o.w, H - GROUND);
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#5aa0d8'); g.addColorStop(1, '#0d2340');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(o.x, GROUND); ctx.lineTo(o.x + 14, H); ctx.lineTo(o.x + o.w - 14, H); ctx.lineTo(o.x + o.w, GROUND); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#081628'; ctx.fillRect(o.x + 16, GROUND + 20, o.w - 32, H);
  } else if (o.type === 'ice') {
    ctx.fillStyle = '#9fd6f5'; ctx.fillRect(o.x, GROUND - o.h, o.w, o.h);
    ctx.fillStyle = '#d9f1ff'; ctx.fillRect(o.x + 5, GROUND - o.h + 5, o.w * 0.35, o.h - 10);
    ctx.strokeStyle = '#5b9fc8'; ctx.lineWidth = 2; ctx.strokeRect(o.x, GROUND - o.h, o.w, o.h);
  } else if (o.type === 'pile') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, GROUND, o.w / 2, o.h, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#d3e6f7';
    ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.62, GROUND, o.w * 0.3, o.h * 0.6, 0, Math.PI, 0); ctx.fill();
  } else if (o.type === 'arch') {
    // 위에서 늘어진 거대한 고드름 기둥
    ctx.fillStyle = '#7fbde6'; ctx.fillRect(o.x, 0, o.w, GROUND - 90);
    ctx.fillStyle = '#b5e0fa'; ctx.fillRect(o.x + 8, 0, 16, GROUND - 90);
    ctx.fillStyle = '#9fd6f5';
    for (let i = 0; i < 5; i++) {
      const x = o.x + i * (o.w / 5);
      ctx.beginPath(); ctx.moveTo(x, GROUND - 90); ctx.lineTo(x + o.w / 10, GROUND - 46 - (i % 2) * 8); ctx.lineTo(x + o.w / 5, GROUND - 90); ctx.fill();
    }
    // 경고 표시
    ctx.fillStyle = '#ffdf5a'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('▼', o.x + o.w / 2, GROUND - 100);
  }
}
function drawItem(it) {
  const y = it.y + Math.sin(t * 4 + it.bob) * 4;
  ctx.save(); ctx.translate(it.x, y);
  if (it.type === 'fish') {
    ctx.fillStyle = '#ffcf3a';
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(20, -7); ctx.lineTo(20, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-7, -2, 3, 3);
  } else {
    ctx.fillStyle = 'rgba(255,170,90,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 22 + Math.sin(t * 6) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e84a3c'; ctx.fillRect(-10, -10, 20, 22);
    ctx.strokeStyle = '#e84a3c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(11, 1, 5, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(-10, -4, 20, 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.moveTo(i * 4, -14); ctx.quadraticCurveTo(i * 4 + 4, -20 - Math.sin(t * 5) * 2, i * 4, -26); ctx.stroke(); }
  }
  ctx.restore();
}
function drawPenguin(pg) {
  ctx.save(); ctx.translate(pg.x, pg.y + Math.abs(Math.sin(pg.f)) * -2); ctx.scale(0.6, 0.6);
  ctx.fillStyle = '#1a1f2b'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 20, Math.sin(pg.f) * 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-3, 3, 7, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff9d2e'; ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(-18, -9); ctx.lineTo(-10, -7); ctx.fill();
  ctx.fillRect(-6, 18, 6, 3); ctx.fillRect(2, 18, 6, 3);
  ctx.restore();
}
function drawPlayer() {
  const p = player;
  if (invuln > 0 && Math.floor(t * 20) % 2 === 0 && state === 'play') return;
  ctx.save(); ctx.translate(PX, p.y);
  const sl = p.sliding && p.onGround;
  const run = Math.sin(p.anim);
  const scared = gap < 150;
  const NAVY = '#1f2a44', BELLY = '#fbfdff', BEAK = '#ffa62b', CHEEK = 'rgba(255,130,150,0.75)';
  const eye = (x, y) => {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, scared ? 4.2 : 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 1.3, y - 1.4, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 1.2, y + 1.3, 0.7, 0, Math.PI * 2); ctx.fill();
  };
  if (sl) {
    // 배로 미끄러지기 🐧💨
    const wob = Math.sin(p.anim * 2) * 1.5;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-34 - i * 10 - (t * 80 % 10), -3 - i * 2, 5 - i, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.ellipse(0, -14 + wob, 32, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BELLY; ctx.beginPath(); ctx.ellipse(4, -8 + wob, 26, 8, 0, 0, Math.PI * 2); ctx.fill();
    // 머리
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(24, -20 + wob, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BELLY; ctx.beginPath(); ctx.ellipse(28, -18 + wob, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
    eye(29, -21 + wob);
    ctx.fillStyle = CHEEK; ctx.beginPath(); ctx.ellipse(27, -14 + wob, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BEAK; ctx.beginPath(); ctx.moveTo(35, -20 + wob); ctx.lineTo(44, -16 + wob); ctx.lineTo(35, -13 + wob); ctx.fill();
    // 뒤로 뻗은 발
    ctx.beginPath(); ctx.ellipse(-34, -12 + wob, 7, 3.5, 0.3, 0, Math.PI * 2); ctx.fill();
    // 날개
    ctx.fillStyle = '#2c3a5c'; ctx.beginPath(); ctx.ellipse(-6, -22 + wob, 14, 5, 0.2, 0, Math.PI * 2); ctx.fill();
    // 목도리
    ctx.fillStyle = '#ff4f6d'; ctx.fillRect(12, -28 + wob, 6, 16);
    ctx.beginPath(); ctx.moveTo(12, -24 + wob); ctx.lineTo(-6 - Math.sin(t * 20) * 3, -32 + wob); ctx.lineTo(-4, -26 + wob); ctx.fill();
  } else {
    const air = !p.onGround;
    const tilt = air ? -0.08 : Math.sin(p.anim) * 0.12; // 뒤뚱뒤뚱
    const hop = air ? 0 : -Math.abs(Math.sin(p.anim)) * 3;
    // 발 (주황색 물갈퀴)
    ctx.fillStyle = BEAK;
    const f1 = air ? -4 : Math.max(0, run) * -5, f2 = air ? -4 : Math.max(0, -run) * -5;
    ctx.beginPath(); ctx.ellipse(-6, -3 + f1, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -3 + f2, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(0, hop); ctx.rotate(tilt);
    // 몸통 (동글동글)
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.ellipse(0, -30, 21, 28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BELLY; ctx.beginPath(); ctx.ellipse(5, -25, 14, 20, 0, 0, Math.PI * 2); ctx.fill();
    // 날개 (파닥파닥)
    const flap = air ? -1.1 + Math.sin(t * 30) * 0.4 : -0.3 + Math.sin(p.anim) * 0.5 + (scared ? Math.sin(t * 25) * 0.4 : 0);
    ctx.fillStyle = '#2c3a5c';
    ctx.save(); ctx.translate(-12, -36); ctx.rotate(flap);
    ctx.beginPath(); ctx.ellipse(0, 12, 6, 15, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // 목도리
    ctx.fillStyle = '#ff4f6d'; ctx.beginPath(); ctx.roundRect(-18, -50, 36, 7, 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-14, -48); ctx.lineTo(-30, -52 + Math.sin(t * 18) * 4); ctx.lineTo(-28, -42 + Math.sin(t * 18 + 1) * 4); ctx.lineTo(-12, -44); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, -50, 3, 7); ctx.fillRect(4, -50, 3, 7);
    // 얼굴 하트 모양 흰 부분
    ctx.fillStyle = BELLY; ctx.beginPath(); ctx.ellipse(1, -60, 9, 8, 0, 0, Math.PI * 2); ctx.ellipse(12, -60, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = NAVY; ctx.beginPath(); ctx.arc(6, -66, 6, 0, Math.PI * 2); ctx.fill();
    // 눈 + 볼터치
    eye(1, -60); eye(13, -60);
    ctx.fillStyle = CHEEK;
    ctx.beginPath(); ctx.ellipse(-3, -54, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, -54, 3.5, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    // 부리
    ctx.fillStyle = BEAK;
    if (scared) { // 겁먹어서 입 벌림
      ctx.beginPath(); ctx.moveTo(4, -56); ctx.lineTo(12, -56); ctx.lineTo(8, -50); ctx.fill();
      ctx.fillStyle = '#d9561a'; ctx.beginPath(); ctx.moveTo(4, -52); ctx.lineTo(12, -52); ctx.lineTo(8, -47); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(3, -56); ctx.lineTo(13, -56); ctx.lineTo(8, -50); ctx.fill();
    }
    // 머리 위 삐침 털
    ctx.strokeStyle = NAVY; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, -67); ctx.quadraticCurveTo(-4, -76, 2, -78); ctx.stroke();
    // 땀
    if (scared) { ctx.fillStyle = '#7fd0ff'; const d = t * 30 % 8; ctx.beginPath(); ctx.arc(-14 - d, -66 + d, 2.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
}
function drawDino() {
  const right = PX - 16 - gap;   // 공룡 주둥이 끝 x
  const bx = right - 150;        // 몸 기준점
  const step = t * (state === 'play' ? speed / 45 : 6);
  const bob = Math.abs(Math.sin(step)) * 6;
  ctx.save(); ctx.translate(bx, GROUND - 10 - bob);
  // 꼬리
  ctx.fillStyle = '#4f8a3c';
  ctx.beginPath(); ctx.moveTo(-40, -110); ctx.quadraticCurveTo(-150, -120 + Math.sin(step) * 10, -190, -80 + Math.sin(step) * 14); ctx.quadraticCurveTo(-120, -80, -30, -70); ctx.fill();
  // 뒷다리
  const lg = Math.sin(step) * 0.6;
  for (const [ox, a, c] of [[-10, lg, '#3f7330'], [20, -lg, '#4f8a3c']]) {
    ctx.save(); ctx.translate(ox, -80); ctx.rotate(a);
    ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(-14, 0, 28, 60, 10); ctx.fill();
    ctx.fillRect(-8, 54, 34, 12);
    ctx.restore();
  }
  // 몸통
  ctx.fillStyle = '#5c9c46'; ctx.beginPath(); ctx.ellipse(10, -120, 70, 50, -0.35, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a8d38a'; ctx.beginPath(); ctx.ellipse(30, -105, 40, 28, -0.4, 0, Math.PI * 2); ctx.fill();
  // 등 가시
  ctx.fillStyle = '#e0b43a';
  for (let i = 0; i < 6; i++) { const x = -40 + i * 18, y = -158 + i * -3 + (i > 3 ? (i - 3) * 6 : 0); ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x + 8, y - 8); ctx.lineTo(x + 16, y + 10); ctx.fill(); }
  // 작은 팔
  ctx.strokeStyle = '#4f8a3c'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(60, -110); ctx.lineTo(78, -96 + Math.sin(step * 2) * 4); ctx.stroke();
  // 머리
  const jaw = 0.25 + (gap < 140 ? 0.25 : 0) + Math.abs(Math.sin(t * 5)) * 0.15 + (state === 'over' ? 0.4 : 0);
  ctx.save(); ctx.translate(70, -170);
  ctx.fillStyle = '#5c9c46'; ctx.beginPath(); ctx.roundRect(-10, -30, 90, 42, 14); ctx.fill();
  // 아래턱
  ctx.save(); ctx.translate(0, 8); ctx.rotate(jaw);
  ctx.fillStyle = '#4f8a3c'; ctx.beginPath(); ctx.roundRect(-4, 0, 78, 20, 8); ctx.fill();
  ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 10, 0); ctx.lineTo(19 + i * 10, -8); ctx.lineTo(24 + i * 10, 0); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(10, 12); ctx.lineTo(76, 12); ctx.lineTo(20, 12 + jaw * 60); ctx.fill();
  ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 10, 12); ctx.lineTo(19 + i * 10, 20); ctx.lineTo(24 + i * 10, 12); ctx.fill(); }
  // 눈
  ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(30, -14, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(30, -20, 3, 12);
  ctx.strokeStyle = '#2d5a20'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(18, -26); ctx.lineTo(42, -20); ctx.stroke();
  ctx.fillStyle = '#2d5a20'; ctx.fillRect(68, -18, 5, 4);
  // 입김
  if (Math.sin(t * 3) > 0.3) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(95 + (t * 40 % 20), 0, 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.restore();
}
function hud() {
  ctx.textAlign = 'left'; ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(14, 12, 230, 64);
  ctx.fillStyle = '#fff';
  ctx.fillText(`점수 ${Math.floor(score)}`, 26, 38);
  ctx.font = '15px sans-serif'; ctx.fillStyle = '#cfe3ff';
  ctx.fillText(`최고 ${best}  ·  ${Math.floor(dist / 10)}m`, 26, 64);
  // 위험 게이지
  const danger = 1 - Math.max(0, Math.min(1, (gap - 40) / 220));
  ctx.textAlign = 'right'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('공룡과의 거리', W - 26, 32);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(W - 226, 42, 200, 16);
  const col = danger > 0.7 ? '#ff3b3b' : danger > 0.4 ? '#ffb02e' : '#4cd97b';
  ctx.fillStyle = col; ctx.fillRect(W - 226, 42, 200 * (1 - danger), 16);
  if (danger > 0.7 && Math.floor(t * 6) % 2 === 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#ff4040';
    ctx.fillText('위험! 쿵쿵쿵!', W / 2, 60);
  }
}
function panel(title, lines, sub) {
  ctx.fillStyle = 'rgba(8,18,40,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 54px sans-serif'; ctx.fillText(title, W / 2, 150);
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#d6e8ff';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 210 + i * 32));
  if (sub && Math.floor(t * 2.5) % 2 === 0) { ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#ffdf5a'; ctx.fillText(sub, W / 2, 440); }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 20, rnd(-1, 1) * shake * 20);
  sky();
  mountains(0.05, 330, 140, '#5b7fae', 1);
  mountains(0.12, 380, 110, '#89a9cf', 7);
  mountains(0.25, 420, 70, '#c2d8ee', 3);
  ground();
  penguins.forEach(drawPenguin);
  obstacles.forEach(drawObstacle);
  items.forEach(drawItem);
  if (state === 'over' && overReason === 'caught') { /* 플레이어는 공룡 입속으로… */ }
  else drawPlayer();
  drawDino();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  for (const s of snow) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();

  if (state === 'play') hud();
  if (state === 'title') {
    panel('🦖 남극 공룡 탈출 🐧', [
      '남극 기지 얼음 속에서 공룡이 깨어났다!',
      '아기 펭귄아, 최대한 멀리 도망쳐!',
      '',
      '점프: Space / ↑  (두 번 누르면 이단 점프)',
      '슬라이드: ↓  — 고드름 아래를 빠져나가자',
      '🐟 생선 = 점수   ☕ 핫초코 = 공룡과 거리 벌리기',
      '모바일: 화면 탭 = 점프, 아래쪽 탭/아래로 스와이프 = 슬라이드',
    ], '스페이스 또는 탭해서 시작');
  }
  if (state === 'over') {
    panel(overReason === 'crevasse' ? '크레바스에 빠졌다!' : '공룡에게 잡혔다!', [
      `점수 ${score}   ·   ${Math.floor(dist / 10)}m 도망침`,
      score >= best && score > 0 ? '🏆 새로운 최고 기록!' : `최고 기록 ${best}`,
    ], t > 0.8 ? '스페이스 또는 탭해서 다시 도전' : '');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
